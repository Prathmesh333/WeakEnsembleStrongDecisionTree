datasets:
  - fashion_mnist
  - cifar10
seeds: [17, 42, 73]
output_dir: artifacts

dataset:
  name: fashion_mnist
  root: data
  base_fraction: 0.60
  meta_fraction: 0.20
  test_fraction: 0.20
  use_official_test: true
  num_workers: 0
  download: true

training:
  # Shared ceiling for both datasets. Fashion-MNIST normally stops much earlier.
  epochs: 150
  batch_size: 128
  learning_rate: 0.002
  weight_decay: 0.0001
  patience: 20
  label_smoothing: 0.0
  device: auto
  scheduler: plateau
  mixed_precision: true
  optimizer: adamw
  momentum: 0.9

tree:
  depths: [3, 5, 7, null]
  min_samples_leaf: [5, 10, 20]
  criteria: [gini, entropy]
  cv_folds: 3

reuse_checkpoints: true
reuse_predictions: true
